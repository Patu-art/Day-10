name: Import Day 10 SITEPRO website
on:
  push:
    paths:
      - '.github/workflows/import-day10-sitepro.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-site:
    if: github.repository == 'Patu-art/Day-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify completed website package
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/day10-part-01.txt .transfer/day10-part-02.txt .transfer/day10-part-03.txt .transfer/day10-part-04.txt | base64 -d > /tmp/day10-site.tar.xz
          echo 'e9179df0b30eadbbbdd5536685dec6d19ff2914e72f586204e06102395b75a4c  /tmp/day10-site.tar.xz' | sha256sum -c -
          tar -tJf /tmp/day10-site.tar.xz | grep -q '^./index.html$'
          tar -xJf /tmp/day10-site.tar.xz -C .
          test -s index.html
          test -s style.css
          test -s script.js
          test -s assets/illustrations/listening-room.svg
          test -e .nojekyll
      - name: Commit production website and remove transfer artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer
          rm -f .github/workflows/import-day10-sitepro.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish complete Day 10 Kiku Hifi SITEPRO frontend and local assets'
          git push
