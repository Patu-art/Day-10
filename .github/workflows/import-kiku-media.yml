name: Import user-supplied Kiku media
on:
  push:
    paths:
      - '.github/workflows/import-kiku-media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'Patu-art/Day-10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify all six supplied images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/photos
          curl --fail --location --silent --show-error --retry 4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/618dbd1b-0ee2-41de-900a-37053b5e0ab9.png' -o 'assets/photos/01-interior.png'
          curl --fail --location --silent --show-error --retry 4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/b2a05f5e-b43a-4c77-96b3-288441335c73.png' -o 'assets/photos/02-coffee.png'
          curl --fail --location --silent --show-error --retry 4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/ca96c7fd-4360-497c-9402-06e85dabf4e4.png' -o 'assets/photos/03-evening.png'
          curl --fail --location --silent --show-error --retry 4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/cfa5d148-5725-480e-ac02-54931f0a8aa0.png' -o 'assets/photos/04-sound.png'
          curl --fail --location --silent --show-error --retry 4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/e3c6a63e-a837-4d64-9807-7cae758da82e.png' -o 'assets/photos/05-exterior.png'
          curl --fail --location --silent --show-error --retry 4 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/cb24ddde-d4e4-42be-8b33-6de5d3028ad3.png' -o 'assets/photos/06-logo.png'
          cat > /tmp/kiku-image-hashes.txt <<'EOF'
          a7d21e3dc6f40da25ce233c90f34fd4734c69387eac6446ee20c78e2264f4cfd  assets/photos/01-interior.png
          eb5aeb46812304c2a08fc48ed4d6dfb00ea9e3a5662351fe0b65e20ef01afbe1  assets/photos/02-coffee.png
          3a63b5963957dc65a4593a8c51a791c281d9bb76719a789e13bf1b83fddccfd3  assets/photos/03-evening.png
          4d9bc9cb56812201dd7ea3106bf37903e10e5fef786aaffdb5bf3ed817bb4d4d  assets/photos/04-sound.png
          f6206b651b6c47e256f14235b0c6c273845490a4d5b843a4ac4f88d37a1540c3  assets/photos/05-exterior.png
          c6b3e6e72763bdc12cd48d9ef98ebd68516134861c2c63993aabdbd624b2b872  assets/photos/06-logo.png
          EOF
          sha256sum --check /tmp/kiku-image-hashes.txt
      - name: Commit originals into repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos/*.png
          if ! git diff --staged --quiet; then
            git commit -m 'Add six user-supplied Kiku venue photos and logo'
            git push
          fi
